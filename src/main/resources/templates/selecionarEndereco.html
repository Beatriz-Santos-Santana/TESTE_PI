<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Selecionar Endereço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .endereco-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f8f9fa;
        }

        .endereco-card input[type="radio"] {
            margin-right: 10px;
        }

        #novoEndereco {
            margin-top: 30px;
            padding: 20px;
            background-color: #fdfdfd;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h4 {
            margin-bottom: 20px;
        }

        .form-section {
            max-width: 900px;
            margin: auto;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }

        .btn-voltar {
            background-color: #6c757d;
            color: white;
        }

        .btn-voltar:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body class="bg-light">

<div class="container form-section py-5">
    <h2 class="mb-4 text-center">Selecione um Endereço para Entrega</h2>

    <form id="formEndereco" method="post">
        <!-- Endereços já existentes -->
        <div id="enderecosExistentes">
            <div th:each="endereco : ${enderecos}" class="endereco-card">
                <label class="form-check-label d-flex align-items-center">
                    <input type="radio" class="form-check-input" name="enderecoSelecionado"
                           th:value="${endereco.id}"
                           th:attr="checked=${enderecoSelecionado != null and endereco.id == enderecoSelecionado.id}">
                    <span th:text="${endereco.logradouro} + ', ' + ${endereco.numero} + ' - ' + ${endereco.bairro} + ', ' + ${endereco.cidade} + '/' + ${endereco.uf}"></span>
                </label>
            </div>
        </div>

        <div class="text-center">
            <button type="button" class="btn btn-outline-primary my-3" onclick="mostrarNovoEndereco()">+ Adicionar Novo Endereço</button>
        </div>

        <!-- Novo endereço -->
        <div id="novoEndereco" style="display: none;">
            <h4>Adicionar Novo Endereço</h4>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="cepNovo" class="form-label">CEP</label>
                    <input type="text" class="form-control" name="cepNovo" id="cepNovo" onblur="consultarCEP(this.value)">
                </div>
                <div class="col-md-6">
                    <label for="logradouroNovo" class="form-label">Logradouro</label>
                    <input type="text" class="form-control" name="logradouroNovo" id="logradouroNovo">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Número</label>
                    <input type="text" class="form-control" name="numeroNovo">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="bairroNovo" class="form-label">Bairro</label>
                    <input type="text" class="form-control" name="bairroNovo" id="bairroNovo">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Complemento</label>
                    <input type="text" class="form-control" name="complementoNovo">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-8">
                    <label for="cidadeNovo" class="form-label">Cidade</label>
                    <input type="text" class="form-control" name="cidadeNovo" id="cidadeNovo">
                </div>
                <div class="col-md-4">
                    <label for="ufNovo" class="form-label">UF</label>
                    <input type="text" class="form-control" name="ufNovo" id="ufNovo">
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="radio" name="principal" id="novoPrincipal" value="true" checked>
                <label class="form-check-label" for="novoPrincipal">
                    Usar este novo endereço como principal
                </label>
            </div>
        </div>

        <!-- Botões -->
        <div class="button-group">
            <a href="/carrinho" class="btn btn-voltar">Voltar</a>

            <button type="submit" class="btn btn-success">Selecionar Pagamento</button>
        </div>
    </form>
</div>

<script>
    function mostrarNovoEndereco() {
        document.getElementById("novoEndereco").style.display = "block";
    }

    document.getElementById("formEndereco").addEventListener("submit", function(event) {
        const usandoNovo = document.getElementById("novoEndereco").style.display === "block";
        const form = event.target;
        form.action = usandoNovo ? "/enderecos/adicionar" : "/enderecos/selecionar";
    });

    async function consultarCEP(cep) {
        cep = cep.replace(/\D/g, '');
        if (cep.length === 8) {
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if (data.erro) {
                    alert("CEP não encontrado.");
                    return;
                }
                document.getElementById('logradouroNovo').value = data.logradouro || '';
                document.getElementById('bairroNovo').value = data.bairro || '';
                document.getElementById('cidadeNovo').value = data.localidade || '';
                document.getElementById('ufNovo').value = data.uf || '';
            } catch (error) {
                alert("Erro ao consultar o CEP.");
                console.error(error);
            }
        } else {
            alert("CEP inválido.");
        }
    }
</script>

</body>
</html>
