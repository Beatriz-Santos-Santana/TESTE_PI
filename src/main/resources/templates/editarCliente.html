<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: whitesmoke;
            font-family: 'Poppins', sans-serif;
            padding: 40px 20px;
        }

        .form-container {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 960px;
            margin: auto;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .header-logo img {
            width: 300px;
            height: auto;
        }

        h2 {
            font-weight: 600;
        }

        hr {
            border: none;
            height: 2px;
            background-color: #ccc;
            margin: 30px 0 20px;
        }

        .endereco-item {
            background-color: #f9f9f9;
        }

        .form-check {
            margin-top: 10px;
        }

        .btn-salvar {
            background-color: #157803;
            color: white;
            border: none;
        }

        .btn-voltar {
            background-color: #b30e0e;
            color: white;
            border: none;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #b30e0e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '\f0c1';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: #b30e0e;
        }
    </style>
</head>
<body>
<div class="form-container">
    <div class="header-logo">
        <img src="/images/logo.png" alt="Logo da Empresa"/>
        <h2>Edição de Cliente</h2>
    </div>

    <hr>
    <h5 class="section-title">Informações de Contato</h5>
    <br>

    <form th:action="@{/editar}" th:object="${cliente}" method="post" id="form-edicao">
        <input type="hidden" th:field="*{id}"/>

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="email">Email</label>
                <input type="email" class="form-control" th:field="*{email}" id="email" readonly>
            </div>
            <div class="col-md-6">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" th:field="*{nome}" id="nome" required>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <label for="senha">Senha</label>
                <input type="password" class="form-control" th:field="*{senha}" id="senha">
            </div>
            <div class="col-md-6">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input type="password" class="form-control" th:field="*{confirmarSenha}" id="confirmarSenha">
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <label for="cpf">CPF</label>
                <input type="text" class="form-control" th:field="*{cpf}" id="cpf" readonly>
            </div>
            <div class="col-md-4">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" class="form-control" th:field="*{dataNascimento}" id="dataNascimento" required>
            </div>
            <div class="col-md-4">
                <label for="genero">Gênero</label>
                <select class="form-select" th:field="*{genero}" id="genero" required>
                    <option value="">Selecione</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                </select>
            </div>
        </div>

        <hr>
        <h5 class="section-title">Endereços de Entrega</h5>
        <br>

        <div id="enderecos-container">
            <div th:each="endereco, iterStat : *{enderecos}" class="endereco-item mb-4 border rounded p-3">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label>CEP</label>
                        <input type="text" class="form-control cep-input" th:field="*{enderecos[__${iterStat.index}__].cep}">
                    </div>
                    <div class="col-md-6">
                        <label>Logradouro</label>
                        <input type="text" class="form-control" th:field="*{enderecos[__${iterStat.index}__].logradouro}">
                    </div>
                    <div class="col-md-2">
                        <label>Número</label>
                        <input type="text" class="form-control" th:field="*{enderecos[__${iterStat.index}__].numero}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Bairro</label>
                        <input type="text" class="form-control" th:field="*{enderecos[__${iterStat.index}__].bairro}">
                    </div>
                    <div class="col-md-6">
                        <label>Complemento</label>
                        <input type="text" class="form-control" th:field="*{enderecos[__${iterStat.index}__].complemento}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-8">
                        <label>Cidade</label>
                        <input type="text" class="form-control" th:field="*{enderecos[__${iterStat.index}__].cidade}">
                    </div>
                    <div class="col-md-4">
                        <label>UF</label>
                        <input type="text" class="form-control" th:field="*{enderecos[__${iterStat.index}__].uf}">
                    </div>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" th:name="'enderecoPrincipal'" th:value="${iterStat.index}" th:checked="${endereco.principal}"/>
                    <label class="form-check-label">Marcar como principal</label>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <button type="button" class="btn btn-outline-secondary" onclick="adicionarEndereco()">+ Adicionar Endereço</button>
        </div>

        <hr>
        <div class="row mt-4">
            <div class="col-md-4">
                <a href="/cardapio" class="btn btn-voltar w-100">
                    <i class="bi bi-arrow-left-circle me-2"></i> Voltar Cardápio
                </a>
            </div>
            <div class="col-md-4 ms-auto">
                <button type="submit" class="btn btn-salvar w-100">
                    <i class="bi bi-check-circle me-2"></i> Salvar Alterações
                </button>
            </div>
        </div>
    </form>
</div>

<script>
    function atualizarEventosCEP(container) {
        container.querySelector(".cep-input").addEventListener("blur", function () {
            const cep = this.value.replace(/\D/g, '');
            if (cep.length !== 8) return;

            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(data => {
                    if (data.erro) return;
                    container.querySelector('input[name$=".logradouro"]').value = data.logradouro || '';
                    container.querySelector('input[name$=".bairro"]').value = data.bairro || '';
                    container.querySelector('input[name$=".cidade"]').value = data.localidade || '';
                    container.querySelector('input[name$=".uf"]').value = data.uf || '';
                });
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".endereco-item").forEach(item => atualizarEventosCEP(item));
    });

    function adicionarEndereco() {
        const container = document.getElementById("enderecos-container");
        const total = container.children.length;
        const template = container.children[0];
        const novo = template.cloneNode(true);

        novo.querySelectorAll("input").forEach(input => {
            const name = input.getAttribute("name");
            if (name) {
                const newName = name.replace(/\[\d+]/, `[${total}]`);
                input.setAttribute("name", newName);
                input.removeAttribute("th:field");
            }
            if (input.type === "radio") {
                input.checked = false;
                input.value = total;
            } else {
                input.value = "";
            }
        });

        container.appendChild(novo);
        atualizarEventosCEP(novo);
    }

    document.getElementById("form-edicao").addEventListener("submit", function (event) {
        const ceps = Array.from(document.querySelectorAll(".cep-input")).map(input =>
            input.value.replace(/\D/g, "")
        );
        const duplicado = ceps.some((cep, idx) => ceps.indexOf(cep) !== idx);

        if (duplicado) {
            event.preventDefault();
            Swal.fire({
                icon: 'warning',
                title: 'CEP duplicado',
                text: 'Você já cadastrou um endereço com este mesmo CEP. Por favor, insira um CEP diferente.',
                confirmButtonColor: '#b30e0e'
            });
        }

    });
</script>
</body>
</html>
