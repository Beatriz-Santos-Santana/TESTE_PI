<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            max-width: 800px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin-top: 20px;
        }

        h2 {
            text-align: center;
            color: #b30e0e;
            font-weight: 700;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-submit {
            background-color: #198c05;
            color: white;
            font-weight: 500;
            padding: 10px;
            border: none;
            border-radius: 6px;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #146a04;
            transform: scale(1.05);
        }

        .img-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }

            h2 {
                font-size: 1.5rem;
            }

            .img-preview {
                width: 80px;
                height: 80px;
            }
        }

        .img-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .img-wrapper img {
            margin-right: 10px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Cadastro de Produto</h2>

    <!-- FLAG para o JS saber se já há uma imagem principal -->
    <input type="hidden" id="jaTemImagemPrincipal" th:value="${produto.imagem != null}" />

    <form th:action="@{/salvar-produto}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${produto.id}">

        <div class="mb-3">
            <label class="form-label">Nome do Produto</label>
            <input type="text" name="nome" class="form-control" required th:value="${produto.nome}">
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea name="descricao" class="form-control" rows="3" required th:text="${produto.descricao}"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade</label>
            <input type="number" name="quantidade" class="form-control" min="1" required th:value="${produto.quantidade}">
        </div>

        <div class="mb-3">
            <label class="form-label">Preço (R$)</label>
            <input type="number" name="valor" class="form-control" step="0.01" required th:value="${produto.valor}">
        </div>

        <div class="mb-3">
            <label class="form-label">Avaliação ⭐⭐⭐⭐⭐</label>
            <select name="avaliacao" class="form-select" required>
                <option th:each="av : ${avaliacoes}" th:value="${av}" th:text="${av}" th:selected="${produto.avaliacao} == ${av}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Imagens do Produto</label>
            <input type="file" name="imagens" class="form-control" accept="image/*" multiple onchange="previsualizarImagens(event)">
            <div id="preview" class="mt-3 d-flex flex-wrap"></div>
        </div>

        <!-- Imagem principal já salva -->
        <div th:if="${produto.imagem != null}" class="mb-3">
            <h6>Imagem Principal Atual:</h6>
            <div class="img-wrapper">
                <img th:src="@{'/uploads/imagens/' + ${produto.imagem}}" alt="Imagem" style="width:150px;" />
            </div>
        </div>

        <!-- Imagens secundárias -->
        <div th:if="${produto.imagensSecundarias != null}" class="mb-3">
            <h6>Imagens Secundárias:</h6>
            <div class="img-wrapper" th:each="img : ${produto.imagensSecundarias}">
                <img th:src="@{'/uploads/imagens/' + ${img.caminhoImagem}}" alt="Imagem" style="width:150px;" />
            </div>
        </div>

        <button type="submit" class="btn btn-submit" name="finalizar" value="true">Salvar e Finalizar</button>
        <button type="submit" class="btn btn-submit" name="finalizar" value="false">Salvar e Incluir + 1 Imagem</button>
    </form>
</div>

<script>
    function previsualizarImagens(event) {
        const previewContainer = document.getElementById('preview');
        const files = event.target.files;
        previewContainer.innerHTML = "";

        const jaTemPrincipal = document.getElementById("jaTemImagemPrincipal").value === "true";

        Array.from(files).forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function (e) {
                const wrapper = document.createElement('div');
                wrapper.className = "d-flex flex-column align-items-center me-3";

                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = "img-preview border";

                const radio = document.createElement('input');
                radio.type = "radio";
                radio.name = "imagemPrincipal";
                radio.value = index;

                // Só exige se não há uma imagem principal já cadastrada
                if (!jaTemPrincipal) {
                    radio.required = true;
                }

                const label = document.createElement("label");
                label.innerText = "Principal";
                label.className = "form-check-label";

                const formCheck = document.createElement("div");
                formCheck.className = "form-check mt-2";
                formCheck.appendChild(radio);
                formCheck.appendChild(label);

                wrapper.appendChild(img);
                wrapper.appendChild(formCheck);
                previewContainer.appendChild(wrapper);
            };
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
